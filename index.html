<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Pioneer Academy, Sonapur</title>
  
  <!-- Google Fonts: Handwritten (Caveat) & Clean UI (Poppins) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #2e1065);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .bg-glow {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }
    .bg-glow-1 { top: 5%; left: 10%; background: #ec4899; }
    .bg-glow-2 { bottom: 5%; right: 10%; background: #38bdf8; }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.25); }
    }

    /* Main Container Card */
    .card-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      max-width: 760px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Full-Quality Image Section */
    .hero-image-wrapper {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #000;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    .hero-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      /* Maximize image clarity & sharpness */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hero-image-wrapper:hover .hero-image {
      transform: scale(1.03);
    }

    /* Content Area */
    .content {
      padding: 35px 30px;
    }

    .badge-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 50px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .badge-school {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    /* Vibrant Gradient Handwritten Text */
    .title {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(45deg, #ff7eb3, #ff758c, #f7d070, #4facfe, #a7f3d0);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
      filter: drop-shadow(0 2px 8px rgba(255, 120, 180, 0.25));
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 2.1rem;
      color: #a7f3d0;
      margin-bottom: 25px;
      text-shadow: 0 0 12px rgba(167, 243, 208, 0.3);
    }

    /* Interactive Email Card */
    .email-box {
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed #f472b6;
      border-radius: 18px;
      padding: 14px 24px;
      margin: 0 auto 30px auto;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .email-box:hover {
      border-color: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
    }

    .email-link {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
      transition: color 0.2s ease;
    }

    .email-box:hover .email-link {
      color: #fbbf24;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 30px;
      border-radius: 50px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="card-container">
    <!-- Top Image Container -->
    <div class="hero-image-wrapper">
      <img src="error.jpg" alt="Pioneer Academy Sonapur Error Banner" class="hero-image">
    </div>

    <!-- Text & Action Content -->
    <div class="content">
      <div class="badge-group">
        <span class="badge badge-danger">Access Forbidden { 403 }</span>
        <span class="badge badge-school">@PIONEER-ACADEMY-SONAPUR</span>
      </div>

      <h1 class="title">Dear user, this site is forbidden for users for now.</h1>
      <p class="subtitle">Please contact the Administrator.</p>

      <div class="email-box">
        <a href="mailto:hellowrakhibul@gmail.com" class="email-link">hellowrakhibul@gmail.com</a>
      </div>

      <div class="btn-group">
        <a href="mailto:hellowrakhibul@gmail.com" class="btn btn-primary">Contact Admin</a>
        <a href="#" class="btn btn-secondary">Return Home</a>
      </div>
    </div>
  </div>

</body>
</html>
